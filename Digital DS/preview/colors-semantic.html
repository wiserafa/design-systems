<!doctype html>
<!-- @dsCard group="Brand" name="Cores semânticas" subtitle="Success · Info · Warn · Error" viewport="700x180" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#1F9D55;border-radius:12px;flex:1;min-height:90px;padding:10px;color:#fff;display:flex;align-items:flex-end;font-size:11px;font-weight:600;">#1F9D55</div>
      <div style="font-size:12px;font-weight:600;">Success</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#2A6FDB;border-radius:12px;flex:1;min-height:90px;padding:10px;color:#fff;display:flex;align-items:flex-end;font-size:11px;font-weight:600;">#2A6FDB</div>
      <div style="font-size:12px;font-weight:600;">Info</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#E0A200;border-radius:12px;flex:1;min-height:90px;padding:10px;color:#fff;display:flex;align-items:flex-end;font-size:11px;font-weight:600;">#E0A200</div>
      <div style="font-size:12px;font-weight:600;">Warn</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#C0392B;border-radius:12px;flex:1;min-height:90px;padding:10px;color:#fff;display:flex;align-items:flex-end;font-size:11px;font-weight:600;">#C0392B</div>
      <div style="font-size:12px;font-weight:600;">Error</div>
    </div>
  </div>
</div>
</body></html>
