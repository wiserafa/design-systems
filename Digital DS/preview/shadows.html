<!doctype html>
<!-- @dsCard group="Brand" name="Elevação & focus ring" subtitle="sm · md · lg · focus laranja" viewport="700x200" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:var(--lum-bg);">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;height:100%;align-items:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:120px;height:80px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(30,30,30,0.06);"></div>
      <div style="font-size:12px;font-weight:600;">shadow-sm</div>
      <div style="font-size:11px;color:var(--lum-muted);text-align:center;">card padrão</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:120px;height:80px;background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(101, 45, 145, 0.08);"></div>
      <div style="font-size:12px;font-weight:600;">shadow-md</div>
      <div style="font-size:11px;color:var(--lum-muted);text-align:center;">card hover</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:120px;height:80px;background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(101, 45, 145, 0.12);"></div>
      <div style="font-size:12px;font-weight:600;">shadow-lg</div>
      <div style="font-size:11px;color:var(--lum-muted);text-align:center;">modal / overlay</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:120px;height:40px;background:#fff;border:1px solid var(--lum-border);border-radius:10px;box-shadow:0 0 0 3px rgba(245, 156, 0, 0.35);"></div>
      <div style="font-size:12px;font-weight:600;">focus-ring</div>
      <div style="font-size:11px;color:var(--lum-muted);text-align:center;">3px laranja α.35</div>
    </div>
  </div>
</div>
</body></html>
