<!doctype html>
<!-- @dsCard group="Brand" name="Badges & chips" subtitle="Segment · status · filtros" viewport="700x240" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; font-family: var(--lum-font-body); }
.chip  { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; font-family: var(--lum-font-body); border: 1.5px solid var(--lum-border); background: #fff; color: var(--lum-text); cursor: pointer; }
.chip.active { background: var(--lum-purple); color: #fff; border-color: var(--lum-purple); }
.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%;">
    <!-- Segment badges -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="badge" style="background:#E1F5F7;color:#02A9B9;"><span class="dot"></span>Fundamental 1</span>
      <span class="badge" style="background:#FFF1E0;color:#D97300;"><span class="dot"></span>Fundamental 2</span>
      <span class="badge" style="background:#F1EBF4;color:#662483;"><span class="dot"></span>Ensino Médio</span>
      <span class="badge" style="background:#E2E8EF;color:#003366;"><span class="dot"></span>Professores</span>
    </div>
    <!-- Status badges -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="badge" style="background:#E2F4EC;color:#1F9D55;">Matriculado</span>
      <span class="badge" style="background:#FDE9C7;color:#C97D00;">Pendente</span>
      <span class="badge" style="background:#FBE5E1;color:#C0392B;">Em atraso</span>
      <span class="badge" style="background:var(--lum-purple);color:#fff;">Novo</span>
    </div>
    <!-- Filter chips -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="chip active">Todos</span>
      <span class="chip">Comunicados</span>
      <span class="chip">Tarefas</span>
      <span class="chip">Eventos</span>
      <span class="chip">Boletim</span>
    </div>
  </div>
</div>
</body></html>
