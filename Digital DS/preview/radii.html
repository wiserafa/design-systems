<!doctype html>
<!-- @dsCard group="Brand" name="Cantos arredondados" subtitle="sm · md · lg · xl · pill" viewport="700x200" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;height:100%;align-items:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:78px;height:78px;background:var(--lum-purple-soft);border:2px solid var(--lum-purple-light);border-radius:6px;"></div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">sm · 6px</div>
      <div style="font-size:11px;color:var(--lum-muted);">tags, inputs</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:78px;height:78px;background:var(--lum-purple-soft);border:2px solid var(--lum-purple-light);border-radius:12px;"></div>
      <div style="font-size:12px;font-weight:600;">md · 12px</div>
      <div style="font-size:11px;color:var(--lum-muted);">buttons, badges</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:78px;height:78px;background:var(--lum-purple-soft);border:2px solid var(--lum-purple-light);border-radius:18px;"></div>
      <div style="font-size:12px;font-weight:600;">lg · 18px</div>
      <div style="font-size:11px;color:var(--lum-muted);">list cards</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:78px;height:78px;background:var(--lum-purple-soft);border:2px solid var(--lum-purple-light);border-radius:24px;"></div>
      <div style="font-size:12px;font-weight:600;">xl · 24px</div>
      <div style="font-size:11px;color:var(--lum-muted);">hero, modals</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:78px;height:78px;background:var(--lum-purple-soft);border:2px solid var(--lum-purple-light);border-radius:999px;"></div>
      <div style="font-size:12px;font-weight:600;">pill · 999</div>
      <div style="font-size:11px;color:var(--lum-muted);">chips, switchers</div>
    </div>
  </div>
</div>
</body></html>
