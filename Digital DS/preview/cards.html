<!doctype html>
<!-- @dsCard group="Brand" name="Cards" subtitle="Branco · roxo-suave · roxo sólido" viewport="700x240" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;height:100%;align-items:center;">
    <!-- White card -->
    <div style="background:#fff;border:1px solid var(--lum-border);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(30,30,30,0.06);">
      <div style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--lum-gold);margin-bottom:8px;">Novidade</div>
      <div style="font-family:var(--lum-font-display);font-weight:700;font-size:20px;color:var(--lum-purple);line-height:1.15;margin-bottom:6px;">Sala maker para o Fundamental 2</div>
      <div style="font-size:13px;color:var(--lum-muted);line-height:1.5;">Inauguramos em março um espaço de prototipagem com impressoras 3D.</div>
    </div>
    <!-- Soft purple card -->
    <div style="background:var(--lum-purple-soft);border-radius:18px;padding:18px;">
      <div style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--lum-seg-medio);margin-bottom:8px;">Ensino Médio</div>
      <div style="font-family:var(--lum-font-display);font-weight:700;font-size:20px;color:var(--lum-purple);line-height:1.15;margin-bottom:6px;">Trilha de eletivas 2026</div>
      <div style="font-size:13px;color:var(--lum-muted);line-height:1.5;">Cinco trilhas opcionais para o último ciclo da Luminova.</div>
    </div>
    <!-- Purple solid card -->
    <div style="background:var(--lum-purple);border-radius:18px;padding:18px;color:#fff;">
      <div style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--lum-gold);margin-bottom:8px;">Inscrições abertas</div>
      <div style="font-family:var(--lum-font-display);font-weight:700;font-size:20px;line-height:1.15;margin-bottom:6px;">Vem visitar a Luminova</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.85);line-height:1.5;">Visitas guiadas todos os sábados de fevereiro.</div>
    </div>
  </div>
</div>
</body></html>
