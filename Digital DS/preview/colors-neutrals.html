<!doctype html>
<!-- @dsCard group="Brand" name="Cores neutras" subtitle="Text, slate, muted, border, bg, surface" viewport="700x200" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#1E1E1E;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;">#1E1E1E</div>
      <div style="font-size:12px;font-weight:600;">Text</div>
      <div style="font-size:11px;color:var(--lum-muted);">Body</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#2A3740;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;">#2A3740</div>
      <div style="font-size:12px;font-weight:600;">Slate</div>
      <div style="font-size:11px;color:var(--lum-muted);">Dark surface</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#706F6F;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;">#706F6F</div>
      <div style="font-size:12px;font-weight:600;">Muted</div>
      <div style="font-size:11px;color:var(--lum-muted);">Secondary</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#E5E1EB;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:var(--lum-text);font-size:11px;font-weight:600;">#E5E1EB</div>
      <div style="font-size:12px;font-weight:600;">Border</div>
      <div style="font-size:11px;color:var(--lum-muted);">Hairline</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#FAFAFB;border:1px solid var(--lum-border);border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:var(--lum-text);font-size:11px;font-weight:600;">#FAFAFB</div>
      <div style="font-size:12px;font-weight:600;">Background</div>
      <div style="font-size:11px;color:var(--lum-muted);">Canvas</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#FFFFFF;border:1px solid var(--lum-border);border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:var(--lum-text);font-size:11px;font-weight:600;">#FFFFFF</div>
      <div style="font-size:12px;font-weight:600;">Surface</div>
      <div style="font-size:11px;color:var(--lum-muted);">Cards / modals</div>
    </div>
  </div>
</div>
</body></html>
