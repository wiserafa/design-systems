<!doctype html>
<!-- @dsCard group="Brand" name="Type scale" subtitle="Display → caption" viewport="700x360" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%;">
    <div style="display:flex;align-items:baseline;gap:18px;">
      <span style="font-family:var(--lum-font-display);font-weight:800;font-size:60px;color:var(--lum-purple);line-height:1;letter-spacing:-0.02em;">Display</span>
      <span style="font-size:12px;color:var(--lum-muted);">64 / 1.05 / 800</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:18px;">
      <span style="font-family:var(--lum-font-display);font-weight:700;font-size:44px;color:var(--lum-purple);line-height:1.1;">H1 · Heading</span>
      <span style="font-size:12px;color:var(--lum-muted);">48 / 1.15 / 700</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:18px;">
      <span style="font-family:var(--lum-font-display);font-weight:700;font-size:30px;color:var(--lum-purple);">H2 · Heading</span>
      <span style="font-size:12px;color:var(--lum-muted);">36 / 1.15 / 700</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:18px;">
      <span style="font-family:var(--lum-font-display);font-weight:700;font-size:22px;color:var(--lum-purple);">H3 · Heading</span>
      <span style="font-size:12px;color:var(--lum-muted);">28 / 1.2 / 700</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:18px;">
      <span style="font-family:var(--lum-font-body);font-weight:400;font-size:16px;color:var(--lum-text);">Body · texto padrão</span>
      <span style="font-size:12px;color:var(--lum-muted);">16 / 1.55 / 400</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:18px;">
      <span style="font-family:var(--lum-font-body);font-weight:400;font-size:13px;color:var(--lum-muted);">Caption · metadata</span>
      <span style="font-size:12px;color:var(--lum-muted);">12 / 1.4 / 400</span>
    </div>
  </div>
</div>
</body></html>
