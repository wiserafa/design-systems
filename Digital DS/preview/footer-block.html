    </div>

      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-weight:700;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--lum-gold);">Matrículas</div>
        <a style="color:#fff;border:none;">Agendar visita</a>
        <a style="color:#fff;border:none;">Vestibulinho</a>
