<!doctype html>
<!-- @dsCard group="Brand" name="Blobs orgânicos" subtitle="Decoração de fundo · roxo + laranja" viewport="700x260" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="position:relative;background:#fff;overflow:hidden;">
  <!-- Blob purple -->
  <div style="position:absolute;left:-60px;top:-40px;width:220px;height:220px;background:#9E54BD;opacity:.22;border-radius:48% 52% 60% 40% / 50% 60% 40% 50%;"></div>
  <!-- Blob gold -->
  <div style="position:absolute;right:-50px;bottom:-50px;width:240px;height:200px;background:#F59C00;opacity:.20;border-radius:60% 40% 50% 50% / 40% 60% 40% 60%;"></div>
  <!-- Blob purple light center-right -->
  <div style="position:absolute;right:30%;top:30%;width:120px;height:120px;background:#652D91;opacity:.10;border-radius:50% 50% 60% 40% / 50% 50% 50% 50%;"></div>

  <div style="position:relative;z-index:1;align-self:center;justify-self:center;margin:auto;text-align:center;">
    <div style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--lum-gold);margin-bottom:8px;">Decoração</div>
    <div style="font-family:var(--lum-font-display);font-weight:800;font-size:32px;color:var(--lum-purple);line-height:1.05;">Blobs orgânicos</div>
    <div style="font-size:13px;color:var(--lum-muted);margin-top:8px;max-width:320px;">Roxo + laranja, 15–25% opacidade, posicionados fora do viewport como elemento gráfico de fundo.</div>
  </div>
</div>
</body></html>
