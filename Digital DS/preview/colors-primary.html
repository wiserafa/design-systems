<!doctype html>
<!-- @dsCard group="Brand" name="Cores primárias" subtitle="Roxo + laranja + variantes" viewport="700x200" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:100%;">
    <!-- Purple primary, with two variants stacked -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#652D91;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--lum-font-body);font-size:11px;font-weight:600;">#652D91</div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Purple</div>
      <div style="font-size:11px;color:var(--lum-muted);">Primary</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#9E54BD;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--lum-font-body);font-size:11px;font-weight:600;">#9E54BD</div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Purple Light</div>
      <div style="font-size:11px;color:var(--lum-muted);">Highlight</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#F3EFF7;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:var(--lum-purple);font-family:var(--lum-font-body);font-size:11px;font-weight:600;border:1px solid var(--lum-border);">#F3EFF7</div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Purple Soft</div>
      <div style="font-size:11px;color:var(--lum-muted);">Background</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#F59C00;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--lum-font-body);font-size:11px;font-weight:600;">#F59C00</div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Gold</div>
      <div style="font-size:11px;color:var(--lum-muted);">Accent / CTA</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#FDE9C7;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#C97D00;font-family:var(--lum-font-body);font-size:11px;font-weight:600;">#FDE9C7</div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Gold Soft</div>
      <div style="font-size:11px;color:var(--lum-muted);">Tint bg</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:#4A1F6B;border-radius:12px;flex:1;min-height:90px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--lum-font-body);font-size:11px;font-weight:600;">#4A1F6B</div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Purple Deep</div>
      <div style="font-size:11px;color:var(--lum-muted);">Hover / press</div>
    </div>
  </div>
</div>
</body></html>
