<!doctype html>
<!-- @dsCard group="Brand" name="Logo on backgrounds" subtitle="Branco, roxo-suave, roxo sólido, laranja" viewport="700x280" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;height:100%;">

    <!-- on white -->
    <div style="background:#fff;border:1px solid var(--lum-border);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:22px;">
      <img src="../assets/luminova-horizontal.svg" alt="" style="height:46px;">
    </div>

    <!-- on purple soft -->
    <div style="background:#F3EFF7;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:22px;">
      <img src="../assets/luminova-horizontal.svg" alt="" style="height:46px;">
    </div>

    <!-- on purple solid -->
    <div style="background:var(--lum-purple);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:22px;">
      <div style="background:#fff;border-radius:999px;padding:10px 18px;">
        <img src="../assets/luminova-horizontal.svg" alt="" style="height:32px;display:block;">
      </div>
    </div>

    <!-- on orange — to avoid (kept for visual reference, no label) -->
    <div style="background:#F59C00;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden;">
      <img src="../assets/luminova-horizontal.svg" alt="" style="height:46px;opacity:.55;">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 14px, rgba(255,255,255,0.20) 14px 16px);pointer-events:none;"></div>
    </div>

  </div>
</div>
</body></html>
