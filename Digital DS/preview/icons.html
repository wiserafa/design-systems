<!doctype html>
<!-- @dsCard group="Brand" name="Ícones (Lucide)" subtitle="Linear · 2px · 24px · CDN" viewport="700x180" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%;">
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--lum-purple);">
      <i data-lucide="calendar"   style="width:24px;height:24px;"></i>
      <i data-lucide="book-open"  style="width:24px;height:24px;"></i>
      <i data-lucide="users"      style="width:24px;height:24px;"></i>
      <i data-lucide="bell"       style="width:24px;height:24px;"></i>
      <i data-lucide="message-square" style="width:24px;height:24px;"></i>
      <i data-lucide="graduation-cap" style="width:24px;height:24px;"></i>
      <i data-lucide="search"     style="width:24px;height:24px;"></i>
      <i data-lucide="settings"   style="width:24px;height:24px;"></i>
      <i data-lucide="check-circle-2" style="width:24px;height:24px;color:var(--lum-success);"></i>
      <i data-lucide="alert-circle" style="width:24px;height:24px;color:var(--lum-warn);"></i>
      <i data-lucide="chevron-right" style="width:24px;height:24px;"></i>
      <i data-lucide="upload"     style="width:24px;height:24px;"></i>
      <i data-lucide="download"   style="width:24px;height:24px;"></i>
      <i data-lucide="file-text"  style="width:24px;height:24px;"></i>
    </div>
    <div style="font-size:12px;color:var(--lum-muted);"><b>Lucide</b> · linear, 2px stroke, round caps · 20–24px · <span style="color:var(--lum-warn);font-weight:600;">substituição flagada</span></div>
  </div>
  <script>lucide.createIcons();</script>
</div>
</body></html>
