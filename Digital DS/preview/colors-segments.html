<!doctype html>
<!-- @dsCard group="Brand" name="Cores por segmento" subtitle="F1 turquesa · F2 laranja · EM roxo · Profs navy" viewport="700x220" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;height:100%;">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="background:#02A9B9;border-radius:14px;flex:1;min-height:110px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:.9;">Fundamental 1</span>
        <span style="font-size:11px;font-weight:600;font-family:var(--lum-font-body);">#02A9B9</span>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Anos 1–5</div>
      <div style="font-size:11px;color:var(--lum-muted);">Turquesa</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="background:#FF9933;border-radius:14px;flex:1;min-height:110px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:.95;">Fundamental 2</span>
        <span style="font-size:11px;font-weight:600;font-family:var(--lum-font-body);">#FF9933</span>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Anos 6–9</div>
      <div style="font-size:11px;color:var(--lum-muted);">Laranja</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="background:#662483;border-radius:14px;flex:1;min-height:110px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:.95;">Ensino Médio</span>
        <span style="font-size:11px;font-weight:600;font-family:var(--lum-font-body);">#662483</span>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Anos 10–12</div>
      <div style="font-size:11px;color:var(--lum-muted);">Roxo</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="background:#003366;border-radius:14px;flex:1;min-height:110px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;">
        <span style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:.95;">Professores</span>
        <span style="font-size:11px;font-weight:600;font-family:var(--lum-font-body);">#003366</span>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--lum-text);">Equipe pedagógica</div>
      <div style="font-size:11px;color:var(--lum-muted);">Navy</div>
    </div>
  </div>
</div>
</body></html>
