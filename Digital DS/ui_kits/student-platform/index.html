<!doctype html>
<!-- @dsCard group="UI Kit — Student Platform" name="Student platform · dashboard" subtitle="Sidebar + dashboard + aula click-thru" viewport="1280x900" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luminova · Plataforma do aluno</title>
  <link rel="icon" href="../../assets/luminova-mark.png" type="image/png">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: var(--lum-bg); }
    body { font-family: var(--lum-font-body); color: var(--lum-text); }
    button { font-family: inherit; }
    button:focus-visible, input:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(245, 156, 0, 0.35);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="Login.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="ActivityCard.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="LessonView.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const App = () => {
      const [signedIn, setSignedIn] = useState(true); // start signed-in for review convenience
      const [segment, setSegment]   = useState('fund2');
      const [view, setView]         = useState('home'); // 'home' | 'lesson'
      const [lesson, setLesson]     = useState(null);

      if (!signedIn) {
        return <Login
          segment={segment}
          onSegmentChange={setSegment}
          onSignIn={() => setSignedIn(true)}
        />;
      }

      return (
        <div style={{ display: 'grid', gridTemplateColumns: '240px 1fr', minHeight: '100vh' }}>
          <Sidebar
            segment={segment}
            current={view === 'lesson' ? 'aulas' : 'home'}
            onNavigate={() => setView('home')}
            onLogout={() => setSignedIn(false)}
          />
          <div>
            <TopBar segment={segment} />
            {view === 'home' && (
              <Dashboard
                segment={segment}
                onOpenLesson={(l) => { setLesson(l); setView('lesson'); }}
              />
            )}
            {view === 'lesson' && lesson && (
              <LessonView
                segment={segment}
                lesson={lesson}
                onBack={() => setView('home')}
              />
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
