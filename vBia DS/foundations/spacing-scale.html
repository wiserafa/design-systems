<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — space-1 to space-9" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white)}
  .wrap{padding:24px 28px;display:flex;gap:16px;align-items:flex-end}
  .unit{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--orange-500);border-radius:3px;width:24px}
  .t{font-family:var(--font-numeric);font-size:11px;color:var(--text-muted)}
</style></head>
<body>
<div class="wrap">
  <div class="unit"><div class="bar" style="height:4px"></div><div class="t">1 · 4</div></div>
  <div class="unit"><div class="bar" style="height:8px"></div><div class="t">2 · 8</div></div>
  <div class="unit"><div class="bar" style="height:12px"></div><div class="t">3 · 12</div></div>
  <div class="unit"><div class="bar" style="height:16px"></div><div class="t">4 · 16</div></div>
  <div class="unit"><div class="bar" style="height:24px"></div><div class="t">5 · 24</div></div>
  <div class="unit"><div class="bar" style="height:32px"></div><div class="t">6 · 32</div></div>
  <div class="unit"><div class="bar" style="height:48px"></div><div class="t">7 · 48</div></div>
  <div class="unit"><div class="bar" style="height:64px"></div><div class="t">8 · 64</div></div>
</div>
</body></html>
