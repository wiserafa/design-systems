<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white)}
  .wrap{padding:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .box{display:table;font-family:var(--font-display);font-weight:700;color:#fff;font-size:34px;line-height:1.02;padding:.08em .22em;border-radius:2px}
</style></head>
<body>
<div class="wrap">
  <span class="box" style="background:var(--orange-500)">Luminova Experience</span>
  <div style="display:flex;gap:10px">
    <span class="box" style="background:var(--lime-500);font-size:26px">Educação</span>
    <span class="box" style="background:var(--purple-700);font-size:26px">Financeira</span>
  </div>
</div>
</body></html>
