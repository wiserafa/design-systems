<!-- @dsCard group="Colors" viewport="700x170" name="Brand core" subtitle="Purple, orange, yellow, plum" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white)}
  .grid{display:flex;gap:14px;padding:22px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .chip{height:70px}
  .meta{padding:8px 10px;font-size:12px}
  .name{font-family:var(--font-display);font-weight:600;color:var(--text-heading)}
  .hex{color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--purple-700)"></div><div class="meta"><div class="name">Purple</div><div class="hex">#642D90</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--orange-500)"></div><div class="meta"><div class="name">Orange</div><div class="hex">#FA9D1C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--yellow-500)"></div><div class="meta"><div class="name">Yellow</div><div class="hex">#FCBC00</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--plum-900)"></div><div class="meta"><div class="name">Plum</div><div class="hex">#210E30</div></div></div>
</div>
</body></html>
