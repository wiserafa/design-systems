<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white)}
  .wrap{padding:24px 28px;max-width:560px}
  .lead{font-size:22px;line-height:1.5;color:var(--text-heading);margin:0 0 12px}
  .body{font-size:17px;line-height:1.65;color:var(--text-body);margin:0}
  .meta{font-family:var(--font-display);color:var(--text-muted);font-size:12px;margin-top:12px}
</style></head>
<body>
<div class="wrap">
  <p class="lead">Na Luminova, aprender é descobrir o mundo todos os dias.</p>
  <p class="body">Com o <strong>Material AZ</strong>, você não só estuda, você acerta no caminho. Utilizado por nós e por escolas de elite em São Paulo.</p>
  <p class="meta">Museo Sans Rounded 500 / 700 · --text-lead 22px · --text-body 17px · line-height 1.5–1.65</p>
</div>
</body></html>
