<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body)}
  .stage{background:var(--gradient-brand);min-height:220px;display:flex;align-items:center;gap:28px;padding:0 40px}
  .logo{height:56px}
  .txt{color:var(--white)}
  .k{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0}
  .s{opacity:.8;font-size:13px;margin:4px 0 0}
</style></head>
<body>
<div class="stage">
  <span style="background:#fff;border-radius:var(--radius-lg);padding:14px 20px;box-shadow:var(--shadow-md)"><img class="logo" src="../assets/logo-luminova-full.png" alt="Luminova"></span>
  <div class="txt"><p class="k">--gradient-brand</p><p class="s">linear-gradient(135deg, #7D31B9 → #210E30). The default dark surface for covers and section slides.</p></div>
</div>
</body></html>
