<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Greys from ink to page" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white)}
  .grid{display:flex;gap:10px;padding:22px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .chip{height:58px}
  .meta{padding:7px 8px}
  .name{font-family:var(--font-display);font-weight:600;color:var(--text-heading);font-size:11px}
  .hex{color:var(--text-muted);text-transform:uppercase;font-size:10px}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--black)"></div><div class="meta"><div class="name">Ink</div><div class="hex">#111015</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-700)"></div><div class="meta"><div class="name">Body</div><div class="hex">#3F3A47</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-500)"></div><div class="meta"><div class="name">Muted</div><div class="hex">#6A6A6A</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-200)"></div><div class="meta"><div class="name">Border</div><div class="hex">#D5D0DC</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--grey-050)"></div><div class="meta"><div class="name">Surface</div><div class="hex">#F4F2F6</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="meta"><div class="name">Page</div><div class="hex">#FFFFFF</div></div></div>
</div>
</body></html>
