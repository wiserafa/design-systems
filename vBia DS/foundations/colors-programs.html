<!-- @dsCard group="Colors" viewport="700x170" name="Program accents" subtitle="The seven program track colors" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--white)}
  .grid{display:flex;gap:10px;padding:22px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .chip{height:64px}
  .meta{padding:7px 8px}
  .name{font-family:var(--font-display);font-weight:600;color:var(--text-heading);font-size:11px}
  .hex{color:var(--text-muted);text-transform:uppercase;font-size:10px}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--yellow-500)"></div><div class="meta"><div class="name">AZ</div><div class="hex">#FCBC00</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--orange-500)"></div><div class="meta"><div class="name">Macmillan</div><div class="hex">#FA9D1C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-700)"></div><div class="meta"><div class="name">Educacross</div><div class="hex">#642D90</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--lime-500)"></div><div class="meta"><div class="name">Financeira</div><div class="hex">#99CC34</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--plum-900)"></div><div class="meta"><div class="name">Régua</div><div class="hex">#210E30</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="meta"><div class="name">Ciências</div><div class="hex">#013366</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="meta"><div class="name">Projetos</div><div class="hex">#028169</div></div></div>
</div>
</body></html>
