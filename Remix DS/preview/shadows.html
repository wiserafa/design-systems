<!doctype html>
<!-- @dsCard group="Spacing" name="Sombra & glow" subtitle="Repouso discreto; glow é a assinatura do Labs" viewport="700x260" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;align-items:center;padding:12px 8px;">
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;">
      <div style="width:100%;height:96px;background:var(--labs-surface);border:1px solid var(--labs-border);border-radius:var(--labs-radius-lg);box-shadow:var(--labs-shadow-card);"></div>
      <div class="sw-name">shadow-card</div>
      <div class="sw-val">repouso · quase nada</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;">
      <div style="width:100%;height:96px;background:var(--labs-surface);border:1px solid var(--labs-purple);border-radius:var(--labs-radius-lg);box-shadow:var(--labs-glow-purple);"></div>
      <div class="sw-name">glow-purple</div>
      <div class="sw-val">hero · card ativo</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;">
      <div style="width:100%;height:96px;background:var(--labs-surface);border:1px solid var(--labs-accent);border-radius:var(--labs-radius-lg);box-shadow:var(--labs-glow-accent);"></div>
      <div class="sw-name">glow-accent</div>
      <div class="sw-val">CTA em foco · ship</div>
    </div>
  </div>
  <div class="meta">A mãe proíbe sombra pesada; o Labs assina com glow — calor, nunca neon</div>
</div>
</body></html>
