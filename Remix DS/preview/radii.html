<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="6 · 12 · 20 · pill — curvas da mãe, ligeiramente mais sóbrias" viewport="700x220" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:1;align-items:center;">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center;">
      <div style="width:100%;height:72px;background:var(--labs-surface);border:1px solid var(--labs-border-strong);border-radius:var(--labs-radius-sm);"></div>
      <div class="sw-name">sm · 6px</div>
      <div class="sw-val">tags, inputs pequenos</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center;">
      <div style="width:100%;height:72px;background:var(--labs-surface);border:1px solid var(--labs-border-strong);border-radius:var(--labs-radius);"></div>
      <div class="sw-name">radius · 12px</div>
      <div class="sw-val">botões, swatches</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center;">
      <div style="width:100%;height:72px;background:var(--labs-surface);border:1px solid var(--labs-border-strong);border-radius:var(--labs-radius-lg);"></div>
      <div class="sw-name">lg · 20px</div>
      <div class="sw-val">cards, modais</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center;">
      <div style="width:100%;height:72px;background:var(--labs-surface);border:1px solid var(--labs-border-strong);border-radius:var(--labs-radius-pill);"></div>
      <div class="sw-name">pill · 999</div>
      <div class="sw-val">botões, badges, chips</div>
    </div>
  </div>
</div>
</body></html>
