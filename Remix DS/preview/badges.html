<!doctype html>
<!-- @dsCard group="Components" name="Badges de estado" subtitle="idea · build · test · ship — mono uppercase" viewport="700x180" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;flex:1;">
    <span style="font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:transparent;color:var(--labs-fg-muted);border:1px solid var(--labs-border-strong);">idea</span>
    <span style="font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:var(--labs-state-build-soft);color:var(--labs-purple-light);border:1px solid var(--labs-purple);">build</span>
    <span style="font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:var(--labs-state-build-soft);color:var(--labs-purple-light);border:1px solid var(--labs-purple);">test</span>
    <span style="font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:var(--labs-accent);color:var(--labs-accent-fg);">ship</span>
  </div>
  <div class="meta">Ship é o único preenchido — chegar lá tem que valer algo</div>
</div>
</body></html>
