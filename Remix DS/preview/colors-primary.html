<!doctype html>
<!-- @dsCard group="Colors" name="Paleta Labs" subtitle="Hues da mãe (roxo 305 · laranja 60), vivendo no escuro" viewport="700x230" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-bg);border:1px solid var(--labs-border-strong);border-radius:var(--labs-radius);flex:1;min-height:90px;"></div>
      <div class="sw-name">bg</div>
      <div class="sw-val">oklch 14% · canvas</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-surface);border:1px solid var(--labs-border);border-radius:var(--labs-radius);flex:1;min-height:90px;"></div>
      <div class="sw-name">surface</div>
      <div class="sw-val">oklch 18% · card</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-elevated);border:1px solid var(--labs-border);border-radius:var(--labs-radius);flex:1;min-height:90px;"></div>
      <div class="sw-name">elevated</div>
      <div class="sw-val">oklch 22%</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-purple);border-radius:var(--labs-radius);flex:1;min-height:90px;"></div>
      <div class="sw-name">purple</div>
      <div class="sw-val">58% .18 305</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-purple-light);border-radius:var(--labs-radius);flex:1;min-height:90px;"></div>
      <div class="sw-name">purple-light</div>
      <div class="sw-val">70% · hover / hero</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-accent);border-radius:var(--labs-radius);flex:1;min-height:90px;"></div>
      <div class="sw-name">accent</div>
      <div class="sw-val">77% .16 60 · CTA</div>
    </div>
  </div>
  <div class="meta">Mesmos hues da mãe — lightness sobe pra brilhar no escuro</div>
</div>
</body></html>
