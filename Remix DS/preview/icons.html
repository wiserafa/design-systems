<!doctype html>
<!-- @dsCard group="Components" name="Ícones (Lucide)" subtitle="Linear · 2px · 24px · purple-light sobre o escuro" viewport="700x190" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%;">
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--labs-purple-light);">
      <i data-lucide="flask-conical" style="width:24px;height:24px;"></i>
      <i data-lucide="cpu"        style="width:24px;height:24px;"></i>
      <i data-lucide="git-branch" style="width:24px;height:24px;"></i>
      <i data-lucide="rocket"     style="width:24px;height:24px;"></i>
      <i data-lucide="users"      style="width:24px;height:24px;"></i>
      <i data-lucide="lightbulb"  style="width:24px;height:24px;"></i>
      <i data-lucide="wrench"     style="width:24px;height:24px;"></i>
      <i data-lucide="search"     style="width:24px;height:24px;"></i>
      <i data-lucide="settings"   style="width:24px;height:24px;"></i>
      <i data-lucide="check-circle-2" style="width:24px;height:24px;color:var(--labs-success);"></i>
      <i data-lucide="alert-circle" style="width:24px;height:24px;color:var(--labs-warn);"></i>
      <i data-lucide="chevron-right" style="width:24px;height:24px;"></i>
      <i data-lucide="upload"     style="width:24px;height:24px;"></i>
      <i data-lucide="file-text"  style="width:24px;height:24px;"></i>
    </div>
    <div style="font-size:12px;color:var(--labs-fg-muted);"><b style="color:var(--labs-fg);">Lucide</b> · linear, 2px stroke, round caps · 20–24px · herdado da mãe</div>
  </div>
  <script>lucide.createIcons();</script>
</div>
</body></html>
