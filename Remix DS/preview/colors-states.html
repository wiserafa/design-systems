<!doctype html>
<!-- @dsCard group="Colors" name="Estados de squad" subtitle="idea · build/test · ship — substitui os segmentos escolares da mãe" viewport="700x230" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:100%;">
    <div style="background:var(--labs-surface);border:1px solid var(--labs-border);border-radius:var(--labs-radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;">
      <span style="align-self:flex-start;font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:transparent;color:var(--labs-state-idea);border:1px solid var(--labs-border-strong);">idea</span>
      <div class="sw-name">Neutro</div>
      <div class="sw-val">Conceito, backlog. Sem cor — ainda não merece.</div>
    </div>
    <div style="background:var(--labs-surface);border:1px solid var(--labs-purple);border-radius:var(--labs-radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;">
      <span style="align-self:flex-start;font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:var(--labs-state-build-soft);color:var(--labs-state-build);border:1px solid var(--labs-purple);">build → test</span>
      <div class="sw-name">Roxo</div>
      <div class="sw-val">Squad ativa, ciclo rodando. Hue 305 herdado.</div>
    </div>
    <div style="background:var(--labs-surface);border:1px solid var(--labs-accent);border-radius:var(--labs-radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;">
      <span style="align-self:flex-start;font-family:var(--labs-font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:var(--labs-radius-pill);background:var(--labs-state-ship);color:var(--labs-accent-fg);">ship</span>
      <div class="sw-name">Laranja</div>
      <div class="sw-val">No ar, em uso. Hue 60 herdado — energia da mãe.</div>
    </div>
  </div>
  <div class="meta">Labs não tem segmentos escolares — tem estados de projeto</div>
</div>
</body></html>
