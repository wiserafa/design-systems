<!doctype html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Surface escura, focus ring accent" viewport="700x240" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1;max-width:420px;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-family:var(--labs-font-display);font-weight:700;font-size:13px;color:var(--labs-fg);">E-mail institucional</label>
      <input type="text" placeholder="voce@luminovainterlagos.com.br" style="font-family:var(--labs-font-body);font-size:15px;padding:12px 16px;border-radius:var(--labs-radius);border:1px solid var(--labs-border-strong);background:var(--labs-surface);color:var(--labs-fg);outline:none;" />
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-family:var(--labs-font-display);font-weight:700;font-size:13px;color:var(--labs-fg);">Em foco</label>
      <input type="text" value="Vitrine Pedagógica" style="font-family:var(--labs-font-body);font-size:15px;padding:12px 16px;border-radius:var(--labs-radius);border:1px solid var(--labs-accent);background:var(--labs-surface);color:var(--labs-fg);outline:none;box-shadow:var(--labs-focus-ring);" />
    </div>
  </div>
  <div class="meta">Focus ring laranja 3px — herdado da mãe, sempre visível</div>
</div>
</body></html>
