<!doctype html>
<!-- @dsCard group="Brand" name="Marca da mãe" subtitle="Logos Luminova em assets/ — co-brand e contextos formais" viewport="700x230" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:center;justify-items:center;flex:1;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <img src="../assets/luminova-mark.png" alt="" style="width:84px;height:84px;border-radius:999px;">
      <div class="meta">Mark</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="background:#fff;border-radius:999px;padding:12px 22px;">
        <img src="../assets/luminova-horizontal.svg" alt="" style="height:40px;display:block;">
      </div>
      <div class="meta">Horizontal · pílula branca</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="background:#fff;border-radius:18px;padding:14px 20px;">
        <img src="../assets/Logo Luminova Interlagos.svg" alt="" style="height:72px;display:block;">
      </div>
      <div class="meta">Lockup com cidade</div>
    </div>
  </div>
  <div class="meta">Logos nunca desenhadas — sempre img de assets/. Nunca aplicar filtros.</div>
</div>
</body></html>
