<!doctype html>
<!-- @dsCard group="Components" name="State switcher" subtitle="Filtro por estado de squad — substitui o segment switcher" viewport="700x180" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;align-items:center;justify-content:center;flex:1;">
    <div style="display:inline-flex;gap:4px;background:var(--labs-surface);border:1px solid var(--labs-border);border-radius:var(--labs-radius-pill);padding:4px;">
      <button style="font-family:var(--labs-font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;border:0;cursor:pointer;padding:9px 18px;border-radius:var(--labs-radius-pill);background:transparent;color:var(--labs-fg-muted);">todos</button>
      <button style="font-family:var(--labs-font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;border:0;cursor:pointer;padding:9px 18px;border-radius:var(--labs-radius-pill);background:transparent;color:var(--labs-fg-muted);">idea</button>
      <button style="font-family:var(--labs-font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;border:0;cursor:pointer;padding:9px 18px;border-radius:var(--labs-radius-pill);background:var(--labs-purple);color:#fff;box-shadow:var(--labs-glow-purple);">build</button>
      <button style="font-family:var(--labs-font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;border:0;cursor:pointer;padding:9px 18px;border-radius:var(--labs-radius-pill);background:transparent;color:var(--labs-fg-muted);">ship</button>
    </div>
  </div>
  <div class="meta">Item ativo: roxo + glow sutil</div>
</div>
</body></html>
