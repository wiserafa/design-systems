<!doctype html>
<!-- @dsCard group="Components" name="Botões" subtitle="Pill, display 700 — glow no hover, não sombra" viewport="700x220" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;flex:1;">
    <button style="font-family:var(--labs-font-display);font-weight:700;font-size:15px;border:0;cursor:pointer;padding:14px 26px;border-radius:var(--labs-radius-pill);background:var(--labs-accent);color:var(--labs-accent-fg);">Aplicar para o Labs</button>
    <button style="font-family:var(--labs-font-display);font-weight:700;font-size:15px;border:0;cursor:pointer;padding:14px 26px;border-radius:var(--labs-radius-pill);background:var(--labs-purple);color:#fff;box-shadow:var(--labs-glow-purple);">Em foco (glow)</button>
    <button style="font-family:var(--labs-font-display);font-weight:700;font-size:15px;cursor:pointer;padding:14px 26px;border-radius:var(--labs-radius-pill);background:transparent;color:var(--labs-fg);border:1px solid var(--labs-border-strong);">Ghost</button>
  </div>
  <div class="meta">Hover: glow acende + translateY(-1px) · Press: accent-deep / purple-deep</div>
</div>
</body></html>
