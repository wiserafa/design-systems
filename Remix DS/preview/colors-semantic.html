<!doctype html>
<!-- @dsCard group="Colors" name="Cores semânticas" subtitle="Feedback ajustado para o escuro" viewport="700x200" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-success);border-radius:var(--labs-radius);flex:1;min-height:70px;"></div>
      <div class="sw-name">success</div>
      <div class="sw-val">72% .17 150</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-info);border-radius:var(--labs-radius);flex:1;min-height:70px;"></div>
      <div class="sw-name">info</div>
      <div class="sw-val">72% .14 250</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-warn);border-radius:var(--labs-radius);flex:1;min-height:70px;"></div>
      <div class="sw-name">warn</div>
      <div class="sw-val">80% .15 85</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-error);border-radius:var(--labs-radius);flex:1;min-height:70px;"></div>
      <div class="sw-name">error</div>
      <div class="sw-val">68% .19 25</div>
    </div>
  </div>
  <div class="meta">Lightness alta para legibilidade sobre oklch 14%</div>
</div>
</body></html>
