<!doctype html>
<!-- @dsCard group="Components" name="Card de projeto" subtitle="Surface + hairline; glow roxo só no ativo" viewport="700x300" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;align-items:stretch;">
    <div style="background:var(--labs-surface);border:1px solid var(--labs-border);border-radius:var(--labs-radius-lg);padding:24px;box-shadow:var(--labs-shadow-card);display:flex;flex-direction:column;gap:8px;">
      <div style="font-family:var(--labs-font-mono);font-size:12px;color:var(--labs-accent);font-weight:500;margin-bottom:6px;">PROJETO 002</div>
      <div style="font-family:var(--labs-font-display);font-weight:700;font-size:20px;color:var(--labs-fg);">Makerthon Luminova v1</div>
      <p style="font-size:14px;color:var(--labs-fg-muted);margin:0;">Squad ataca problema real com dono interno. Estado de repouso: sombra discreta.</p>
    </div>
    <div style="background:var(--labs-surface);border:1px solid var(--labs-purple);border-radius:var(--labs-radius-lg);padding:24px;box-shadow:var(--labs-glow-purple);display:flex;flex-direction:column;gap:8px;">
      <div style="font-family:var(--labs-font-mono);font-size:12px;color:var(--labs-accent);font-weight:500;margin-bottom:6px;">PROJETO 001</div>
      <div style="font-family:var(--labs-font-display);font-weight:700;font-size:20px;color:var(--labs-fg);">Vitrine Pedagógica</div>
      <p style="font-size:14px;color:var(--labs-fg-muted);margin:0;">Card ativo / hover: borda roxa + glow aceso. Presença, não ruído.</p>
    </div>
  </div>
</div>
</body></html>
