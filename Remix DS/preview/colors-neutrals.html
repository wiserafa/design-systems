<!doctype html>
<!-- @dsCard group="Colors" name="Texto & bordas" subtitle="Warm near-white sobre grafite-índigo" viewport="700x210" -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-fg);border-radius:var(--labs-radius);flex:1;min-height:80px;"></div>
      <div class="sw-name">fg</div>
      <div class="sw-val">98.5% .005 85 · warm white</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-fg-muted);border-radius:var(--labs-radius);flex:1;min-height:80px;"></div>
      <div class="sw-name">fg-muted</div>
      <div class="sw-val">65% .02 285 · secundário</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-surface);border:1px solid var(--labs-border);border-radius:var(--labs-radius);flex:1;min-height:80px;display:flex;align-items:center;justify-content:center;"><span class="sw-val">1px hairline</span></div>
      <div class="sw-name">border</div>
      <div class="sw-val">white / .10</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--labs-surface);border:1px solid var(--labs-border-strong);border-radius:var(--labs-radius);flex:1;min-height:80px;display:flex;align-items:center;justify-content:center;"><span class="sw-val">hover / ghost</span></div>
      <div class="sw-name">border-strong</div>
      <div class="sw-val">white / .15</div>
    </div>
  </div>
</div>
</body></html>
